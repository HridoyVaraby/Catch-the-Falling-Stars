<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#000000">
    <title>Catch the Falling Stars</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="game-container">
        <a href="settings.html" id="settingsButton" class="settings-button" title="Game Settings" aria-label="Open game settings">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <circle cx="12" cy="12" r="3"/>
                <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
            </svg>
        </a>
        <div id="startScreen" class="backdrop-blur-lg bg-black/30 p-8 rounded-2xl border border-white/20 shadow-2xl">
            <h1 class="text-4xl font-bold mb-6 bg-gradient-to-r from-yellow-200 via-yellow-400 to-yellow-600 text-transparent bg-clip-text">Catch the Falling Stars</h1>
            
            <div class="mb-8 text-white/80">
                <div class="text-2xl font-semibold mb-4 bg-gradient-to-r from-purple-400 to-pink-600 text-transparent bg-clip-text">High Score: <span id="startScreenHighScore" class="text-3xl">0</span></div>
            </div>
            
            <button id="startButton" class="w-full py-4 px-8 bg-gradient-to-r from-yellow-400 to-yellow-600 text-black font-bold rounded-xl hover:from-yellow-500 hover:to-yellow-700 transform hover:scale-105 transition-all duration-200 shadow-lg hover:shadow-yellow-500/50" aria-label="Start the game">Start Game</button>
        </div>
        <div class="game-content hidden">
            <div class="game-header backdrop-blur-md bg-black/30 p-4 rounded-t-lg border-b border-white/10 shadow-lg">
                <div class="score font-bold text-transparent bg-clip-text bg-gradient-to-r from-yellow-200 to-yellow-500">Score: <span id="score" class="text-2xl">0</span></div>
                <div class="high-score font-bold text-transparent bg-clip-text bg-gradient-to-r from-purple-400 to-pink-600">High Score: <span id="highScore" class="text-2xl">0</span></div>
                <div class="lives font-bold text-transparent bg-clip-text bg-gradient-to-r from-red-400 to-red-600">Lives: <span id="lives" class="text-2xl">5</span></div>
            </div>
            <div id="gameArea" role="main" aria-label="Game playing area">
                <div id="basket" aria-label="Player basket"></div>
            </div>
            <div id="gameOver" class="hidden">
                <h2>Game Over!</h2>
                <p>Final Score: <span id="finalScore">0</span></p>
                <div class="button-container">
                    <button id="restartButton" aria-label="Restart the game">Play Again</button>
                    <button id="homeButton" aria-label="Return to home screen">Go Home</button>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script src="game.js"></script>
</body>
</html>
